html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);

  font-size:17px;line-height:1.6}

header .wrap{padding-top:28px;padding-bottom:20px}
h1{margin:0 0 6px;font-size:1.7rem;color:var(--accent)}
header p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;padding:10px 18px;border-radius:10px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface);color:var(--text)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){ .tab[aria-selected="true"]{color:#0d1117} }
main{padding:24px 0 60px}
.banner{border:1px solid var(--danger);background:var(--danger-soft);color:var(--danger);

.note{color:var(--muted);margin:4px 0 12px}
.label{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-weight:600;font-size:.95rem}
.chip{font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--border)}
.cmd{display:flex;align-items:stretch;background:var(--code-bg);border-radius:10px;overflow:hidden;
  border:1px solid var(--border);margin:0 0 8px}
.cmd pre{margin:0;padding:12px 14px;flex:1;min-width:0;overflow-x:auto;color:var(--code-text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:.92rem;line-height:1.5;white-space:pre}
.copy{flex:none;width:96px;border:0;border-left:1px solid #2b3642;background:#1c2733;color:#cfe3f7;
  font:inherit;font-size:.88rem;font-weight:600;cursor:pointer}

summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--danger)}

footer{color:var(--muted);font-size:.9rem;padding-bottom:40px}

function copyText(text, btn){
  const done = () => {
    btn.textContent = "Copié ✓"; btn.classList.add("done");
    setTimeout(() => { btn.textContent = "Copier"; btn.classList.remove("done"); }, 1600);
  };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e) { btn.textContent = "Échec"; }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else { fallback(); }
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function cmdRow(cmd){
  const row = el("div", "cmd");
  const pre = el("pre", null, cmd);
  const btn = el("button", "copy", "Copier");
  btn.type = "button";
  btn.setAttribute("aria-label", "Copier la commande");
  btn.addEventListener("click", () => copyText(cmd, btn));
  row.append(pre, btn);
  return row;
}

function blockView(b){
  const frag = document.createDocumentFragment();
  if (b.label || b.shell) {
    const l = el("div", "label");
    if (b.label) l.append(el("span", null, b.label));
    if (b.shell) l.append(el("span", "chip", b.shell));
    frag.append(l);
  }
  frag.append(cmdRow(b.cmd));
  return frag;
}

function stepView(step, i){
  const card = el("section", "card");
  const h = el("h2");
  h.append(el("span", "n", String(i + 1)), document.createTextNode(step.title));
  card.append(h);
  if (step.note) card.append(el("p", "note", step.note));

  if (step.variants) {
    const names = Object.keys(step.variants);
    const seg = el("div", "seg");
    const holder = el("div");
    const show = (name) => {
      holder.replaceChildren(...step.variants[name].map(cmdRow));
      [...seg.children].forEach(b => b.setAttribute("aria-pressed", String(b.textContent === name)));
    };
    names.forEach(n => {
      const b = el("button", null, n); b.type = "button";
      b.addEventListener("click", () => show(n));
      seg.append(b);
    });
    card.append(seg, holder);
    show(names[0]);
  }
  (step.blocks || []).forEach(b => card.append(blockView(b)));

  if (step.errors && step.errors.length) {
    const d = el("details");
    d.append(el("summary", null, "Erreurs et solutions (" + step.errors.length + ")"));
    const box = el("div", "errs");
    step.errors.forEach(e => {
      const w = el("div", "err");
      w.append(el("h4", null, e.title), el("p", null, e.cause));
      (e.fix || []).forEach(c => w.append(cmdRow(c)));
      box.append(w);
    });
    d.append(box);
    card.append(d);
  }
  return card;
}

const app = document.getElementById("app");
function render(os){
  const d = DATA[os];
  app.replaceChildren();
  if (d.banner) app.append(el("div", "banner", d.banner));
  d.steps.forEach((s, i) => app.append(stepView(s, i)));
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.os === os)));
  try { history.replaceState(null, "", "#" + os); } catch(e) {}
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { render(t.dataset.os); window.scrollTo(0, 0); }));
render(location.hash === "#linux" ? "linux" : "windows");
</script>
</body>
</html>
